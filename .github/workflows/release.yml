name: release nightly

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  SK_VERSION: nover

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      # Pull the artifacts produced by the build workflow that just finished.
      - name: Download artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: cmake.yml
          branch: ${{ github.event.workflow_run.head_branch }}
          workflow_conclusion: success

      - name: Download artifacts (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: cmake.yml
          branch: master
          workflow_conclusion: success

      # Signing keys are optional: without the secrets the job still publishes
      # unsigned archives instead of failing.
      - name: Import signature key
        if: ${{ env.GHA_GPG_KEY != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        env:
          GHA_GPG_KEY: ${{ secrets.GHA_GPG_KEY }}
        with:
          gpg_private_key: ${{ secrets.GHA_GPG_KEY }}
          passphrase: ${{ secrets.GHA_GPG_PWD }}

      - name: Move artifacts to workspace
        run: |
          set -e
          shopt -s nullglob
          for file in *; do
            [ -d "$file" ] || continue
            echo "packing $file"
            if [[ $file == *-win64 ]]; then
              7z a "$file.7z" "./$file/." > /dev/null
              [ -n "${GHA_GPG_KEY:-}" ] && gpg --detach-sign --batch --yes "$file.7z"
            else
              for t in "$file"/*.tar.xz; do
                base=$(basename "$t" .tar.xz)
                echo "SK_VERSION=$(echo "$base" | cut -d'-' -f 2)" >> "$GITHUB_ENV"
                mv "$t" .
                [ -n "${GHA_GPG_KEY:-}" ] && gpg --detach-sign --batch --yes "./$base.tar.xz"
              done
            fi
          done
          ls -la

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Delete previous nightly
        working-directory: repo
        continue-on-error: true
        run: gh release delete nightly --cleanup-tag --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.xz
            *.7z
            *.sig
          tag_name: nightly
          name: HavokToolset ${{ env.SK_VERSION }} (nightly)
          body: |
            简体中文版 Havok 工具集 / Simplified Chinese Havok toolset.

            Every binary defaults to Chinese; switch with `--language en`,
            `HAVOK_LANG=en`, or `<common><language>en</language>` in
            `havok_toolset.config`.
          fail_on_unmatched_files: false
