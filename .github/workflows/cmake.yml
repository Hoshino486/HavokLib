name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # Linux: library + toolset + python module + unit tests.
  # 3rd_party/spike is a regular directory in this fork (the upstream submodule
  # was folded in), so checkout must NOT be asked to recurse.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04

    env:
      CC: gcc-12
      CXX: g++-12

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 ninja-build cmake \
            python3-dev python3-setuptools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist \
            -DCMAKE_INSTALL_RPATH='$ORIGIN;$ORIGIN/../modules;$ORIGIN/../lib'

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure

      # The whole point of this fork: Chinese by default, English on demand.
      - name: Verify localization
        run: |
          set -e
          exe=$(find build -name havok_toolset -type f -perm -u+x | head -n 1)
          echo "binary: $exe"
          "$exe" hk_to_gltf --help        > help_zh.txt 2>&1 || true
          "$exe" hk_to_gltf --help -l en  > help_en.txt 2>&1 || true
          echo "--- default (zh) ---"; head -4 help_zh.txt
          echo "--- -l en ---";      head -4 help_en.txt
          grep -q '选项:'   help_zh.txt
          grep -q 'Options:' help_en.txt
          echo "localization OK"

      - name: Install
        run: cmake --build build --target install

      # Install layout on UNIX: <prefix>/havok_toolset, <prefix>/modules/*.spk
      - name: Verify installed layout
        run: |
          set -e
          find ${{ github.workspace }}/dist -maxdepth 3 | head -40
          exe=$(find ${{ github.workspace }}/dist -name havok_toolset -type f | head -n 1)
          test -n "$exe"
          test -n "$(find ${{ github.workspace }}/dist -name '*.spk' | head -n 1)"
          out=$("$exe" hk_to_gltf --help -l en 2>&1 | head -6)
          echo "$out"
          echo "$out" | grep -q 'Options:'
          echo "installed toolset OK"

      - name: Pack toolset
        run: |
          set -e
          cd ${{ github.workspace }}/dist
          cp ../LICENSE . 2>/dev/null || true
          cp ../toolset/README.md . 2>/dev/null || true
          cp ../toolset/README.en.md . 2>/dev/null || true
          SK_VERSION=$(cat ${{ github.workspace }}/build/toolset/version 2>/dev/null || echo nover)
          echo "SK_VERSION=$SK_VERSION" >> $GITHUB_ENV
          tar -cvaf ../HavokToolset-${SK_VERSION}-linux-amd64.tar.xz \
            --exclude python_module .

      - name: Upload toolset
        uses: actions/upload-artifact@v4
        with:
          name: HavokToolset-linux-amd64
          path: ${{ github.workspace }}/HavokToolset-*-linux-amd64.tar.xz
          retention-days: 5

      - name: Upload python module
        uses: actions/upload-artifact@v4
        with:
          name: HavokPy-linux-amd64
          path: ${{ github.workspace }}/dist/python_module/lib
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Windows: MSVC x64 with Ninja - the exact toolchain combination this fork was
  # ported to and verified with (see build.cmd). Upstream used clang; that is no
  # longer required because the CMake flag sets are now compiler agnostic.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          # Single line on purpose: a PowerShell backtick continuation mangles
          # the arguments and injects the literal text "$env:BUILD_TYPE" into
          # the generated ninja rules.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: |
          ctest --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify localization
        run: |
          $exe = (Get-ChildItem -Recurse -Filter havok_toolset.exe build |
                  Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
                  Select-Object -First 1).FullName
          if (-not $exe) { throw "havok_toolset.exe not built" }
          Write-Host "binary: $exe"
          Write-Host "--- default (zh) ---"
          & $exe hk_to_gltf --help       2>&1 | Select-Object -First 4
          Write-Host "--- -l en ---"
          & $exe hk_to_gltf --help -l en 2>&1 | Select-Object -First 4
          $zh = (& $exe hk_to_gltf --help        2>&1 | Out-String)
          $en = (& $exe hk_to_gltf --help -l en  2>&1 | Out-String)
          if ($zh -notmatch '选项:' -or $en -notmatch 'Options:') {
            throw "localization check failed"
          }
          Write-Host "localization OK"

      - name: Install
        run: |
          cmake --build build --target install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Install layout on Windows: <prefix>/bin/havok_toolset.exe,
      # <prefix>/bin/modules/*.spk, <prefix>/python_module/lib/havokpy.pyd
      - name: Verify installed layout
        run: |
          Get-ChildItem -Recurse "${{ github.workspace }}/dist" |
            Select-Object -ExpandProperty FullName
          $toolset = "${{ github.workspace }}/dist/bin/havok_toolset.exe"
          if (-not (Test-Path $toolset)) { throw "installed toolset missing" }
          $spk = Get-ChildItem -Recurse -Filter *.spk "${{ github.workspace }}/dist" |
                   Select-Object -First 1
          if (-not $spk) { throw "installed module missing" }
          $out = (& $toolset hk_to_gltf --help -l en 2>&1 | Out-String)
          if ($out -notmatch 'Options:') { throw "installed toolset broken" }
          Write-Host "installed toolset OK"

      - name: Pack
        run: |
          $ver = "nover"
          $vf = "${{ github.workspace }}/build/toolset/version"
          if (Test-Path $vf) { $ver = (Get-Content $vf -Raw).Trim() }
          "SK_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Copy-Item LICENSE              dist/bin/LICENSE       -ErrorAction SilentlyContinue
          Copy-Item toolset/README.md    dist/bin/README.md     -ErrorAction SilentlyContinue
          Copy-Item toolset/README.en.md dist/bin/README.en.md  -ErrorAction SilentlyContinue

      - name: Upload toolset
        uses: actions/upload-artifact@v4
        with:
          name: HavokToolset-win64
          path: ${{ github.workspace }}/dist/bin
          retention-days: 5

      - name: Upload python module
        uses: actions/upload-artifact@v4
        with:
          name: HavokPy-win64
          path: ${{ github.workspace }}/dist/python_module/lib
          retention-days: 5
